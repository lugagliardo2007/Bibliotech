<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bibliotech - Gestión de Equipos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0d1b2a;--navy2:#1b2d42;--gold:#c9a84c;--cream:#f5f0e8;
      --white:#fff;--gray:#6b7a8d;--light:#eef1f5;
      --red:#c0392b;--green:#1a7a4a;--blue:#1a56db;
    }
    body{font-family:'Source Sans 3',sans-serif;background:var(--cream);color:var(--navy);min-height:100vh}

    /* LOGIN */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
    #login-screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(201,168,76,.06) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(201,168,76,.06) 60px)}
    .login-card{position:relative;z-index:1;background:var(--white);border-radius:2px;width:440px;box-shadow:0 24px 64px rgba(0,0,0,.4);overflow:hidden;animation:up .5s ease both}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .lh{background:var(--navy2);padding:36px 40px 28px;border-bottom:3px solid var(--gold)}
    .lh .badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:3px 10px;margin-bottom:14px}
    .lh h1{font-family:'Playfair Display',serif;font-size:28px;color:var(--white)}
    .lh p{color:rgba(255,255,255,.5);font-size:13px;margin-top:6px}
    .lb{padding:36px 40px}
    .lb label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
    .lb input{width:100%;border:1.5px solid #dde1e7;border-radius:2px;padding:11px 14px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--navy);background:var(--light);transition:border-color .2s;margin-bottom:18px}
    .lb input:focus{outline:none;border-color:var(--gold);background:var(--white)}
    .btn-login{width:100%;background:var(--navy);color:var(--white);border:none;border-radius:2px;padding:13px;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;transition:background .2s}
    .btn-login::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--gold)}
    .btn-login:hover{background:var(--navy2)}
    .hint{margin-top:20px;background:var(--light);border-left:3px solid var(--gold);padding:12px 14px;font-size:12px;color:var(--gray);line-height:1.9}
    .hint b{color:var(--navy)}
    #lerr{display:none;color:var(--red);font-size:12px;margin-top:-10px;margin-bottom:14px}

    /* APP */
    #app{display:none;min-height:100vh;flex-direction:column}
    header{background:var(--navy);border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;position:sticky;top:0;z-index:100}
    .logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--white)}
    .logo span{color:var(--gold)}
    nav{display:flex;gap:4px}
    nav button{background:none;border:none;color:rgba(255,255,255,.55);font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:8px 16px;cursor:pointer;border-radius:2px;transition:color .2s,background .2s}
    nav button:hover{color:var(--white);background:rgba(255,255,255,.06)}
    nav button.active{color:var(--gold);background:rgba(201,168,76,.1)}
    .hr{display:flex;align-items:center;gap:14px}
    .utag{font-size:12px;color:rgba(255,255,255,.5)}
    .utag b{color:var(--gold)}

    /* SWITCH ROL — clave del fix */
    .switch-btn{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;cursor:pointer;border-radius:2px;font-family:'Source Sans 3',sans-serif;transition:all .2s}
    .switch-btn:hover{background:var(--gold);color:var(--navy)}
    .btn-logout{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;cursor:pointer;border-radius:2px;transition:all .2s;font-family:'Source Sans 3',sans-serif}
    .btn-logout:hover{border-color:var(--red);color:var(--red)}

    main{flex:1;padding:40px;max-width:1100px;margin:0 auto;width:100%}
    .panel{animation:up .3s ease both}
    .stitle{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);margin-bottom:4px}
    .ssub{font-size:13px;color:var(--gray);margin-bottom:32px}

    /* STATS */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:36px}
    .sc{background:var(--white);border:1px solid #e2e6eb;border-top:3px solid var(--gold);padding:22px 24px;border-radius:2px}
    .sc .num{font-family:'Playfair Display',serif;font-size:36px;color:var(--navy);line-height:1}
    .sc .lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray);margin-top:6px}

    /* EQUIP GRID */
    .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .ecard{background:var(--white);border:1px solid #e2e6eb;border-radius:2px;padding:20px;transition:box-shadow .2s,transform .2s}
    .ecard:hover{box-shadow:0 4px 24px rgba(13,27,42,.12);transform:translateY(-2px)}
    .eico{font-size:28px;margin-bottom:10px}
    .ename{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy)}
    .eid{font-size:11px;color:var(--gray);margin-bottom:14px}
    .eact{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}

    /* BADGES */
    .bs{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:1px}
    .bd{background:#e6f4ee;color:var(--green)}
    .bo2{background:#fff0e0;color:#b05a00}
    .bf{background:#fdecea;color:var(--red)}
    .bac{background:#e6f4ee;color:var(--green)}
    .bre{background:#fdecea;color:var(--red)}
    .ben{background:#e8f0fe;color:var(--blue)}

    /* MULTI-SELECT EQUIPOS */
    .esel{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-top:6px}
    .eci{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid #dde1e7;border-radius:2px;background:var(--light);cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
    .eci:hover{border-color:var(--gold)}
    .eci.sel{border-color:var(--gold);background:#fdf8ee}
    .eci input{accent-color:var(--gold);width:16px;height:16px;cursor:pointer;flex-shrink:0}
    .ein{font-size:13px;font-weight:600;color:var(--navy)}
    .eii{font-size:11px;color:var(--gray)}

    /* BUTTONS */
    .bsm{font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:6px 12px;border-radius:2px;border:1.5px solid transparent;cursor:pointer;transition:opacity .2s,box-shadow .2s}
    .bsm:hover{opacity:.85}
    .b-p{background:var(--navy);color:var(--white)}
    .b-d{background:#fdecea;color:var(--red)}
    .b-g{background:var(--gold);color:var(--navy)}
    .b-o{background:transparent;color:var(--gray);border-color:#d0d5dc}
    .b-o:hover{border-color:var(--navy);color:var(--navy)}
    .act-g{box-shadow:0 0 0 2.5px var(--gold)}
    .act-n{box-shadow:0 0 0 2.5px var(--navy)}
    .act-r{box-shadow:0 0 0 2.5px var(--red)}

    /* FORM */
    .fcard{background:var(--white);border:1px solid #e2e6eb;border-radius:2px;padding:32px 36px;max-width:680px}
    .fcard h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid #e8eaed}
    .fr{margin-bottom:18px}
    .fr label{display:block;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
    .fr input,.fr select,.fr textarea{width:100%;border:1.5px solid #dde1e7;border-radius:2px;padding:10px 14px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--navy);background:var(--light);transition:border-color .2s}
    .fr textarea{resize:vertical;min-height:80px}
    .fr input:focus,.fr select:focus,.fr textarea:focus{outline:none;border-color:var(--gold);background:var(--white)}
    .bsub{background:var(--navy);color:var(--white);border:none;padding:12px 28px;font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:2px;border-bottom:3px solid var(--gold);transition:opacity .2s}
    .bsub:hover{opacity:.85}

    /* TABLE */
    .tw{background:var(--white);border:1px solid #e2e6eb;border-radius:2px;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:580px}
    thead{background:var(--navy)}
    thead th{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);padding:14px 20px;text-align:left;white-space:nowrap}
    tbody tr{border-bottom:1px solid #eef0f3;transition:background .15s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--light)}
    tbody td{padding:14px 20px;font-size:14px;color:var(--navy);vertical-align:top}
    .tsub{font-size:11px;color:var(--gray);margin-top:3px}
    .ba2{display:flex;gap:6px;flex-wrap:wrap}
    .bacc{background:#e6f4ee;color:var(--green);border:none;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:2px;cursor:pointer}
    .brej{background:#fdecea;color:var(--red);border:none;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:2px;cursor:pointer}
    .bdel{background:#e8f0fe;color:var(--blue);border:none;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:2px;cursor:pointer}
    .bacc:hover,.brej:hover,.bdel:hover{opacity:.8}

    /* HISTORIAL */
    .hlist{display:flex;flex-direction:column;gap:16px}
    .hcard{background:var(--white);border:1px solid #e2e6eb;border-left:4px solid var(--gold);border-radius:2px;padding:20px 24px}
    .hcard.ep{border-left-color:#b05a00}
    .hcard.ea{border-left-color:var(--green)}
    .hcard.er{border-left-color:var(--red)}
    .hcard.ee{border-left-color:var(--blue)}
    .hctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .hceqs{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy)}
    .hcmeta{font-size:12px;color:var(--gray);margin-top:4px}
    .hcobs{font-size:13px;color:var(--gray);margin-top:10px;font-style:italic}

    /* TOAST */
    #toast{position:fixed;bottom:32px;right:32px;background:var(--navy);color:var(--white);padding:14px 22px;border-radius:2px;border-left:4px solid var(--gold);font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.25);transform:translateY(80px);opacity:0;transition:all .3s ease;z-index:9999;max-width:320px}
    #toast.show{transform:translateY(0);opacity:1}

    /* EMPTY */
    .empty{text-align:center;padding:60px 20px;color:var(--gray)}
    .empty .ei{font-size:40px;margin-bottom:12px}
    .empty p{font-size:14px}

    @media(max-width:768px){
      header{padding:0 16px;flex-wrap:wrap;height:auto;gap:8px;padding-block:12px}
      nav button{font-size:10px;padding:6px 10px}
      main{padding:20px 16px}
      .stats{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="lh">
      <div class="badge">Sistema Escolar</div>
      <h1>Bibliotech</h1>
      <p>Gestión de préstamos de equipos tecnológicos</p>
    </div>
    <div class="lb" id="lb-login">
      <label>Usuario o email</label>
      <input id="inp-u" type="text" placeholder="Ingresá tu usuario o email" autocomplete="off"/>
      <label>Contraseña</label>
      <input id="inp-p" type="password" placeholder="••••••••"/>
      <div id="lerr">❌ Usuario o contraseña incorrectos.</div>
      <button class="btn-login" onclick="doLogin()">Ingresar al sistema</button>
      <div class="hint">
        ¿Sos docente y no tenés cuenta? <a href="#" onclick="toggleAuth('register');return false;">Creá una acá</a>.
      </div>
    </div>

    <div class="lb" id="lb-register" style="display:none">
      <label>Nombre completo</label>
      <input id="reg-nombre" type="text" placeholder="Nombre y apellido" autocomplete="off"/>
      <label>Email</label>
      <input id="reg-email" type="email" placeholder="tu@email.com" autocomplete="off"/>
      <label>Contraseña</label>
      <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres"/>
      <label>Confirmar contraseña</label>
      <input id="reg-pass2" type="password" placeholder="Repetí la contraseña"/>
      <div id="rerr" style="display:none;color:var(--red);font-size:12px;margin-top:-10px;margin-bottom:14px"></div>
      <button class="btn-login" onclick="doRegister()">Crear cuenta de docente</button>
      <div class="hint">
        ¿Ya tenés cuenta? <a href="#" onclick="toggleAuth('login');return false;">Iniciá sesión</a>.
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">Tech<span>Loan</span></div>
    <nav id="nav"></nav>
    <div class="hr">
      <div class="utag">Rol: <b id="ulbl"></b></div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <main id="mc"></main>
</div>
<div id="toast"></div>

<script>
let currentUser = null; // { id, username, name, role }

/* ── LOGIN ── */
async function doLogin() {
  const u = document.getElementById('inp-u').value.trim();
  const p = document.getElementById('inp-p').value.trim();
  const err = document.getElementById('lerr');

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({usuario: u, pass: p})
  });
  const data = await res.json();

  if (data.ok) {
    err.style.display = 'none';
    // Normalizamos el rol que viene de la base ("Rol") a 'docente' o 'biblio'
    const rolNorm = (data.rol || '').toLowerCase().includes('biblio') ? 'biblio' : 'docente';
    currentUser = { id: data.id, username: u, name: data.nombre, role: rolNorm };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    applyRole();
  } else {
    err.style.display = 'block';
  }
}
document.getElementById('inp-p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('inp-u').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function toggleAuth(which){
  document.getElementById('lb-login').style.display    = which==='login'    ? 'block':'none';
  document.getElementById('lb-register').style.display = which==='register'? 'block':'none';
  document.getElementById('lerr').style.display='none';
  document.getElementById('rerr').style.display='none';
}

/* ── REGISTRO (solo docentes) ── */
async function doRegister(){
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email  = document.getElementById('reg-email').value.trim();
  const pass   = document.getElementById('reg-pass').value;
  const pass2  = document.getElementById('reg-pass2').value;
  const rerr   = document.getElementById('rerr');

  const showErr = (msg) => { rerr.textContent = '❌ ' + msg; rerr.style.display = 'block'; };

  if (!nombre || !email || !pass || !pass2) { showErr('Completá todos los campos.'); return; }
  if (!/^\S+@\S+\.\S+$/.test(email))        { showErr('Ingresá un email válido.'); return; }
  if (pass.length < 6)                      { showErr('La contraseña debe tener al menos 6 caracteres.'); return; }
  if (pass !== pass2)                       { showErr('Las contraseñas no coinciden.'); return; }

  const res = await fetch('/api/registrar', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nombre, email, pass })
  });
  const data = await res.json();

  if (data.ok) {
    rerr.style.display='none';
    currentUser = { id: data.id, username: email, name: data.nombre, role: 'docente' };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    toast('✅ Cuenta creada. ¡Bienvenido/a!');
    applyRole();
  } else {
    showErr(data.error || 'No se pudo crear la cuenta.');
  }
}

function doLogout(){
  currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('inp-p').value='';
  document.getElementById('inp-u').value='';
  document.getElementById('reg-nombre').value='';
  document.getElementById('reg-email').value='';
  document.getElementById('reg-pass').value='';
  document.getElementById('reg-pass2').value='';
  toggleAuth('login');
}

function applyRole(){
  document.getElementById('ulbl').textContent = currentUser.role==='docente' ? 'Docente' : 'Bibliotecario';
  buildNav();
  showPanel(currentUser.role==='docente' ? 'disponibilidad' : 'pedidos');
}

/* ── NAV ── */
const TABS={
  docente:[
    {id:'disponibilidad',label:'Disponibilidad'},
    {id:'pedir',         label:'Hacer pedido'},
    {id:'reportar',      label:'Reportar fallo'},
    {id:'historial',     label:'Mis pedidos'},
  ],
  biblio:[
    {id:'pedidos',  label:'Pedidos recibidos'},
    {id:'reportes', label:'Reportes de fallos'},
    {id:'equipos',  label:'Gestión de equipos'},
  ]
};

function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  TABS[currentUser.role].forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t.label;
    b.dataset.id=t.id;
    b.onclick=()=>showPanel(t.id);
    nav.appendChild(b);
  });
}

function showPanel(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  const mc=document.getElementById('mc');
  mc.innerHTML='';
  const el=document.createElement('div');
  el.className='panel';
  PANELS[id](el);
  mc.appendChild(el);
}

/* ── HELPERS ── */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}

function ico(tipo){return tipo==='Computadora'?'💻':'📋'}

// Estado de un Equipo ("Estado_actual" en la tabla Equipo: 'Libre' / 'En uso')
function beq(estado){
  return estado==='Libre'
    ? '<span class="bs bd">Disponible</span>'
    : '<span class="bs bo2">En uso</span>';
}

// Estado de una Reserva ("estado_reserva": pendiente/aceptado/rechazado/entregado)
function bped(estado){
  const c={pendiente:'bo2',aceptado:'bac',rechazado:'bre',entregado:'ben'};
  const l={pendiente:'En espera',aceptado:'Aceptado',rechazado:'Rechazado',entregado:'Entregado'};
  return `<span class="bs ${c[estado]||'bo2'}">${l[estado]||estado}</span>`;
}

function fmt(s){
  if(!s)return'—';
  const d=new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

/* ═══════════════════════════════════════════════
   PANELS
═══════════════════════════════════════════════ */
const PANELS={

  /* ── DOCENTE: disponibilidad ── */
  async disponibilidad(el) {
    el.innerHTML = '<div class="stitle">Disponibilidad</div><div class="ssub">Cargando...</div>';
    const equipos = await fetch('/api/get_recursos').then(r => r.json());
    const disp = equipos.filter(e => e.Estado_actual === 'Libre').length;
    const ocup = equipos.filter(e => e.Estado_actual === 'En uso').length;
    el.innerHTML = `
      <div class="stitle">Disponibilidad de Equipos</div>
      <div class="ssub">Estado actual en tiempo real.</div>
      <div class="stats">
        <div class="sc"><div class="num">${equipos.length}</div><div class="lbl">Total</div></div>
        <div class="sc"><div class="num">${disp}</div><div class="lbl">Disponibles</div></div>
        <div class="sc"><div class="num">${ocup}</div><div class="lbl">En uso</div></div>
      </div>
      <div class="egrid">
        ${equipos.map(e => `
          <div class="ecard">
            <div class="eico">${ico(e.Tipo)}</div>
            <div class="ename">${e.Tipo} #${e.id_equipo}</div>
            <div class="eid">${e.modelo || ''}</div>
            ${beq(e.Estado_actual)}
          </div>`).join('')}
      </div>`;
  },

  /* ── DOCENTE: pedir ── */
  async pedir(el) {
    el.innerHTML = '<div class="stitle">Hacer un Pedido</div><div class="ssub">Cargando equipos...</div>';
    const equipos = await fetch('/api/get_recursos').then(r => r.json());
    const disp = equipos.filter(e => e.Estado_actual === 'Libre');
    el.innerHTML = `
      <div class="stitle">Hacer un Pedido</div>
      <div class="ssub">Seleccioná los equipos que necesitás.</div>
      <div class="fcard" style="max-width:720px">
        <h3>Solicitud de equipos</h3>
        <div class="fr"><label>Aula</label><input id="fa" type="text" placeholder="Ej: Aula 3B"/></div>
        <div class="fr">
          <label>Equipos disponibles</label>
          ${disp.length === 0
            ? '<div style="padding:14px;background:var(--light);border-radius:2px;color:var(--gray)">⚠️ No hay equipos disponibles.</div>'
            : `<div class="esel" id="esel">
                ${disp.map(e => `
                  <label class="eci" id="lbl-${e.id_equipo}">
                    <input type="checkbox" value="${e.id_equipo}" onchange="togEci('${e.id_equipo}')"/>
                    <span style="font-size:18px">${ico(e.Tipo)}</span>
                    <span><div class="ein">${e.Tipo} #${e.id_equipo}</div><div class="eii">${e.modelo || ''}</div></span>
                  </label>`).join('')}
              </div>`}
        </div>
        <div class="fr"><label>Fecha de uso</label><input id="ff" type="date"/></div>
        <div class="fr">
          <label>Turno / horario</label>
          <select id="ft">
            <option value="">— Seleccioná —</option>
            <option>Mañana</option>
            <option>Tarde</option>
            <option>Noche</option>
          </select>
        </div>
        <button class="bsub" id="fsubbtn">Enviar solicitud</button>
      </div>`;

    setTimeout(() => {
      const fe = document.getElementById('ff');
      if (!fe) return;
      fe.value = new Date().toISOString().slice(0,10);
    }, 0);

    document.getElementById('fsubbtn').onclick = async () => {
      const aula = document.getElementById('fa').value.trim();
      const fechaUso = document.getElementById('ff').value;
      const turnoHorario = document.getElementById('ft').value;
      const checks = document.querySelectorAll('#esel input:checked');
      const equiposIds = Array.from(checks).map(c => Number(c.value));

      if (!aula)             { toast('⚠️ Ingresá el aula.'); return; }
      if (!fechaUso)         { toast('⚠️ Seleccioná la fecha de uso.'); return; }
      if (!turnoHorario)     { toast('⚠️ Seleccioná el turno.'); return; }
      if (!equiposIds.length){ toast('⚠️ Seleccioná al menos un equipo.'); return; }

      const res = await fetch('/api/hacer_pedido', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ idUsuario: currentUser.id, aula, fechaUso, turnoHorario, equiposIds })
      });
      const data = await res.json();

      if (data.ok) {
        toast('✅ Pedido enviado al bibliotecario.');
        showPanel('historial');
      } else {
        toast('⚠️ ' + (data.error || 'No se pudo enviar el pedido.'));
      }
    };
  },

  /* ── DOCENTE: reportar fallo ── */
  async reportar(el){
    el.innerHTML = '<div class="stitle">Reportar Fallo</div><div class="ssub">Cargando equipos...</div>';
    const equipos = await fetch('/api/get_recursos').then(r => r.json());
    el.innerHTML=`
      <div class="stitle">Reportar Fallo</div>
      <div class="ssub">Informá un problema técnico. El bibliotecario revisará el reporte.</div>
      <div class="fcard">
        <h3>Formulario de reporte</h3>
        <div class="fr">
          <label>Equipo con fallo</label>
          <select id="req">
            <option value="">— Seleccioná el equipo —</option>
            ${equipos.map(e=>`<option value="${e.id_equipo}">${e.Tipo} #${e.id_equipo} ${e.modelo?'('+e.modelo+')':''}</option>`).join('')}
          </select>
        </div>
        <div class="fr"><label>Descripción</label><textarea id="rdesc" placeholder="Describí el fallo con detalle..."></textarea></div>
        <button class="bsub" id="rsubbtn">Enviar reporte</button>
      </div>`;

    document.getElementById('rsubbtn').onclick = async () => {
      const idEquipo = document.getElementById('req').value;
      const descripcion = document.getElementById('rdesc').value.trim();

      if(!idEquipo)   { toast('⚠️ Seleccioná un equipo.'); return; }
      if(!descripcion){ toast('⚠️ Describí el problema.'); return; }

      const res = await fetch('/api/hacer_reporte', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ idUsuario: currentUser.id, idEquipo: Number(idEquipo), descripcion })
      });
      const data = await res.json();

      if (data.ok) {
        toast('✅ Reporte enviado.');
        showPanel('disponibilidad');
      } else {
        toast('⚠️ ' + (data.error || 'No se pudo enviar el reporte.'));
      }
    };
  },

  /* ── DOCENTE: mis pedidos ── */
  async historial(el){
    el.innerHTML = '<div class="stitle">Mis Pedidos</div><div class="ssub">Cargando...</div>';
    const list = (await fetch('/api/get_pedidos').then(r => r.json()))
      .filter(p => p.id_usuario === currentUser.id);

    el.innerHTML=`<div class="stitle">Mis Pedidos</div><div class="ssub">Historial de tus solicitudes y su estado.</div>`;
    if(!list.length){
      el.innerHTML+=`<div class="empty"><div class="ei">📭</div><p>Todavía no hiciste ningún pedido.</p></div>`;
      return;
    }
    const cls={pendiente:'ep',aceptado:'ea',rechazado:'er',entregado:'ee'};
    el.innerHTML+=`<div class="hlist">
      ${list.map(p=>`
        <div class="hcard ${cls[p.estado_reserva]||''}">
          <div class="hctop">
            <div>
              <div class="hceqs">${p.equipos.map(e=>`${e.Tipo} #${e.id_equipo}`).join(', ')}</div>
              <div class="hcmeta">Aula: ${p.aula} &nbsp;·&nbsp; ${fmt(p.fecha_uso)} &nbsp;·&nbsp; ${p.turno_horario}</div>
            </div>
            ${bped(p.estado_reserva)}
          </div>
        </div>`).join('')}
    </div>`;
  },

  /* ── BIBLIOTECARIO: pedidos recibidos ── */
  async pedidos(el) {
    el.innerHTML = '<div class="stitle">Pedidos Recibidos</div><div class="ssub">Cargando...</div>';
    const list = await fetch('/api/get_pedidos').then(r => r.json());
    el.innerHTML = '<div class="stitle">Pedidos Recibidos</div><div class="ssub">Gestioná las solicitudes de los docentes.</div>';
    const tw = document.createElement('div');
    tw.className = 'tw';
    el.appendChild(tw);
    if (!list.length) { tw.innerHTML = '<div class="empty"><div class="ei">📭</div><p>No hay pedidos.</p></div>'; return; }
    tw.innerHTML = `<table>
      <thead><tr><th>Docente</th><th>Aula</th><th>Equipos</th><th>Fecha uso</th><th>Turno</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>
      ${list.map(p => `
        <tr>
          <td>${p.nombreDocente}</td>
          <td>${p.aula}</td>
          <td>${p.equipos.map(e=>`<div>${e.Tipo} #${e.id_equipo}</div>`).join('')}</td>
          <td>${fmt(p.fecha_uso)}</td>
          <td>${p.turno_horario}</td>
          <td>${bped(p.estado_reserva)}</td>
          <td>
            ${p.estado_reserva === 'pendiente' ? `
              <div class="ba2">
                <button class="bacc" onclick="accionPHP(${p.ID_reserva},'aceptar')">Aceptar</button>
                <button class="brej" onclick="accionPHP(${p.ID_reserva},'rechazar')">Rechazar</button>
              </div>` : ''}
            ${p.estado_reserva === 'aceptado' ? `
              <div class="ba2">
                <button class="bdel" onclick="accionPHP(${p.ID_reserva},'entregar')">Entregado</button>
              </div>` : ''}
            ${(p.estado_reserva === 'entregado' || p.estado_reserva === 'rechazado') ? '<span style="color:var(--gray);font-size:12px">—</span>' : ''}
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  },

  /* ── BIBLIOTECARIO: reportes de fallos ── */
  async reportes(el) {
    el.innerHTML = '<div class="stitle">Reportes de Fallos</div><div class="ssub">Cargando...</div>';
    const list = await fetch('/api/get_reportes').then(r => r.json());
    el.innerHTML = '<div class="stitle">Reportes de Fallos</div><div class="ssub">Fallos reportados por los docentes.</div>';
    const tw = document.createElement('div');
    tw.className = 'tw';
    el.appendChild(tw);
    if (!list.length) { tw.innerHTML = '<div class="empty"><div class="ei">✅</div><p>No hay reportes.</p></div>'; return; }
    tw.innerHTML = `<table>
      <thead><tr><th>Docente</th><th>Equipo</th><th>Descripción</th><th>Fecha</th><th>Estado</th></tr></thead>
      <tbody>
      ${list.map(r => `
        <tr>
          <td>${r.nombreDocente}</td>
          <td>${r.tipoEquipo} ${r.modelo?'('+r.modelo+')':''}</td>
          <td>${r.Descripcion}</td>
          <td>${fmt(r.fecha_reporte)}</td>
          <td>${r.estado_fallo}</td>
        </tr>`).join('')}
      </tbody></table>`;
  },

  /* ── BIBLIOTECARIO: gestión de equipos ── */
  async equipos(el){
    el.innerHTML = '<div class="stitle">Gestión de Equipos</div><div class="ssub">Cargando...</div>';
    const equipos = await fetch('/api/get_recursos').then(r => r.json());
    const total = equipos.length;
    const disp = equipos.filter(e=>e.Estado_actual==='Libre').length;
    const ocup = equipos.filter(e=>e.Estado_actual==='En uso').length;

    el.innerHTML=`
      <div class="stitle">Gestión de Equipos</div>
      <div class="ssub">Marcá manualmente el estado de cada equipo y agregá nuevos.</div>
      <div class="stats">
        <div class="sc"><div class="num">${total}</div><div class="lbl">Total</div></div>
        <div class="sc"><div class="num">${disp}</div><div class="lbl">Disponibles</div></div>
        <div class="sc"><div class="num">${ocup}</div><div class="lbl">En uso</div></div>
      </div>
      <div class="egrid">
        ${equipos.map(e=>`
          <div class="ecard">
            <div class="eico">${ico(e.Tipo)}</div>
            <div class="ename">${e.Tipo} #${e.id_equipo}</div>
            <div class="eid">${e.modelo || ''} ${e.num_serie ? '· '+e.num_serie : ''}</div>
            ${beq(e.Estado_actual)}
            <div class="eact">
              <button class="bsm b-g ${e.Estado_actual==='Libre'?'act-g':''}" onclick="cambiarEstado(${e.id_equipo},'Libre')">Disponible</button>
              <button class="bsm b-p ${e.Estado_actual==='En uso'?'act-n':''}" onclick="cambiarEstado(${e.id_equipo},'En uso')">En uso</button>
            </div>
          </div>`).join('')}
      </div>
      <div style="margin-top:40px">
        <div class="stitle" style="font-size:20px;margin-bottom:4px">Agregar nuevo equipo</div>
        <div class="ssub">Registrá una computadora o tablero.</div>
        <div class="fcard">
          <h3>Nuevo equipo</h3>
          <div class="fr"><label>Tipo</label>
            <select id="net"><option value="">— Seleccioná —</option><option value="Computadora">Computadora</option><option value="Tablero">Tablero</option></select>
          </div>
          <div class="fr"><label>Modelo</label><input id="nem" type="text" placeholder="Ej: Lenovo ThinkPad"/></div>
          <div class="fr"><label>Número de serie</label><input id="nes" type="text" placeholder="Opcional"/></div>
          <button class="bsub" id="aebtn">Agregar equipo</button>
        </div>
      </div>`;

    document.getElementById('aebtn').onclick = async () => {
      const tipo = document.getElementById('net').value;
      const modelo = document.getElementById('nem').value.trim();
      const numSerie = document.getElementById('nes').value.trim();
      if(!tipo || !modelo){ toast('⚠️ Completá tipo y modelo.'); return; }

      const res = await fetch('/api/agregar_equipo', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tipo, modelo, numSerie })
      });
      const data = await res.json();
      if (data.ok) {
        toast('✅ Equipo agregado.');
        showPanel('equipos');
      } else {
        toast('⚠️ ' + (data.error || 'No se pudo agregar el equipo.'));
      }
    };
  }
};

/* ═══════════════════════════════════════════════
   ACCIONES
═══════════════════════════════════════════════ */
function togEci(id){
  const lbl=document.getElementById('lbl-'+id);
  if(lbl)lbl.classList.toggle('sel',lbl.querySelector('input').checked);
}

async function cambiarEstado(idEquipo, estado){
  const res = await fetch('/api/actualizar_equipo', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ idEquipo, estado })
  });
  const data = await res.json();
  if (data.ok) {
    toast('🔄 Equipo #'+idEquipo+' → '+(estado==='Libre'?'Disponible':'En uso'));
    showPanel('equipos');
  } else {
    toast('⚠️ ' + (data.error || 'No se pudo actualizar.'));
  }
}

async function accionPHP(idReserva, accion) {
  const res = await fetch('/api/accion_pedido', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ idReserva, accion })
  });
  const data = await res.json();
  if (data.ok) {
    const msg = accion === 'aceptar' ? '✅ Pedido aceptado.' : accion === 'rechazar' ? '❌ Rechazado.' : '📦 Entregado.';
    toast(msg);
  } else {
    toast('⚠️ ' + (data.error || 'No se pudo procesar la acción.'));
  }
  showPanel('pedidos');
}
</script>
</body>
</html>
